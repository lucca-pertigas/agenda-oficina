<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agenda da Oficina</title>

    <link rel="stylesheet"
          th:href="@{/css/agenda.css}">
</head>

<body>

<header class="topo">

    <div>
        <h1>Agenda da Oficina</h1>

        <p>
            Gerenciamento de agendamentos
        </p>
    </div>

    <button
            class="btn btn-primary"
            type="button"
            onclick="abrirFormulario()">

        + Novo Agendamento

    </button>

</header>


<main>

    <!-- ============================= -->
    <!-- NAVEGAÇÃO -->
    <!-- ============================= -->

    <section class="navegacao-agenda">

        <a class="btn btn-secondary"
           th:href="@{/agenda(data=${dataAnterior})}">
            &larr;
        </a>

        <a class="btn btn-secondary"
           th:href="@{/agenda}">
            Hoje
        </a>

        <a class="btn btn-secondary"
           th:href="@{/agenda(data=${dataProxima})}">
            &rarr;
        </a>

        <h2 th:text="${#temporals.format(data, 'dd/MM/yyyy')}">
            13/08/2026
        </h2>

    </section>


    <!-- ============================= -->
    <!-- GRADE DA AGENDA -->
    <!-- ============================= -->

    <section>

        <div
                id="agendaGrid"
                class="agenda-grid"

                th:attr="data-data-agenda=${data}"

                th:style="
                    '--quantidade-elevadores:' +
                    ${#lists.size(elevadores)}
                ">

            <!-- Cabeçalho horário -->

            <div class="agenda-cabecalho horario-coluna">
                Horário
            </div>


            <!-- Cabeçalhos dos elevadores -->

            <div
                    class="agenda-cabecalho"
                    th:each="elevador : ${elevadores}">

                Elevador

                <span th:text="${elevador.numero}">
                    1
                </span>

            </div>


            <!-- Horários -->

            <th:block th:each="horario : ${horarios}">

                <div
                        class="agenda-horario"

                        th:text="${#temporals.format(
                            horario,
                            'HH:mm'
                        )}">

                    08:00

                </div>


                <!-- Células -->

                <div
                        class="agenda-celula"

                        th:each="elevador : ${elevadores}"

                        th:attr="
                            data-elevador-id=${elevador.id},
                            data-horario=${#temporals.format(
                                horario,
                                'HH:mm'
                            )}
                        ">


                    <!-- Cards existentes -->

                    <div
                            class="agendamento-card"

                            th:each="agendamento : ${agendamentos}"

                            th:if="${
                                agendamento.elevadorId == elevador.id
                                and
                                !agendamento.dataHoraInicio
                                    .toLocalTime()
                                    .isBefore(horario)
                                and
                                agendamento.dataHoraInicio
                                    .toLocalTime()
                                    .isBefore(
                                        horario.plusMinutes(30)
                                    )
                            }"

                            th:classappend="${
                                agendamento.status.name()
                                == 'CONCLUIDO'
                                ? ' status-concluido'
                                : ' status-agendado'
                            }"

                            th:attr="
                                data-agendamento-id=${agendamento.id},
                                data-tecnico-id=${agendamento.tecnicoId},
                                data-tecnico=${agendamento.tecnicoNome},
                                data-elevador-id=${agendamento.elevadorId},
                                data-elevador=${agendamento.elevadorNumero},
                                data-servico-id=${agendamento.servicoId},
                                data-servico=${agendamento.servicoNome},
                                data-data-hora-inicio=${agendamento.dataHoraInicio},
                                data-inicio=${#temporals.format(
                                    agendamento.dataHoraInicio,
                                    'dd/MM/yyyy HH:mm'
                                )},
                                data-fim=${#temporals.format(
                                    agendamento.dataHoraFim,
                                    'dd/MM/yyyy HH:mm'
                                )},
                                data-status=${agendamento.status}
                            "

                            th:style="
                                'height:' +
                                (${agendamento.duracaoMinutos}
                                / 30.0 * 70)
                                + 'px;' +

                                'top:' +
                                ((${agendamento.minutoInicio}
                                % 30)
                                / 30.0 * 70)
                                + 'px;'
                            "

                            onclick="abrirDetalhesAgendamento(this)">


                        <strong
                                th:text="${agendamento.servicoNome}">
                            Serviço
                        </strong>


                        <span
                                th:text="${agendamento.tecnicoNome}">
                            Técnico
                        </span>


                        <small>

                            <span
                                    th:text="${#temporals.format(
                                        agendamento.dataHoraInicio,
                                        'HH:mm'
                                    )}">
                                08:00
                            </span>

                            -

                            <span
                                    th:text="${#temporals.format(
                                        agendamento.dataHoraFim,
                                        'HH:mm'
                                    )}">
                                09:00
                            </span>

                        </small>

                    </div>

                </div>

            </th:block>

        </div>

    </section>

</main>


<!-- ================================================= -->
<!-- MODAL NOVO AGENDAMENTO -->
<!-- ================================================= -->

<div
        id="modalAgendamento"
        class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                Novo Agendamento
            </h2>

            <button
                    type="button"
                    onclick="fecharFormulario()">
                ×
            </button>

        </div>


        <div class="modal-body">

            <label for="tecnico">
                Técnico
            </label>

            <select id="tecnico">

                <option value="">
                    Selecione
                </option>

                <option
                        th:each="tecnico : ${tecnicos}"
                        th:value="${tecnico.id}"
                        th:text="${tecnico.nome}">
                </option>

            </select>


            <label for="elevador">
                Elevador
            </label>

            <select id="elevador">

                <option value="">
                    Selecione
                </option>

                <option
                        th:each="elevador : ${elevadores}"
                        th:value="${elevador.id}"
                        th:text="'Elevador ' + ${elevador.numero}">
                </option>

            </select>


            <label for="servico">
                Serviço
            </label>

            <select id="servico">

                <option value="">
                    Selecione
                </option>

                <option
                        th:each="servico : ${servicos}"
                        th:value="${servico.id}"
                        th:text="${servico.nome}">
                </option>

            </select>


            <label for="dataHoraInicio">
                Data e horário
            </label>

            <input
                    id="dataHoraInicio"
                    type="datetime-local">


            <button
                    class="btn btn-primary"
                    type="button"
                    onclick="salvarAgendamento()">

                Salvar Agendamento

            </button>


            <p
                    id="mensagemFormulario"
                    class="mensagem-formulario">
            </p>

        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- MODAL DETALHES -->
<!-- ================================================= -->

<div
        id="modalDetalhes"
        class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                Detalhes do Agendamento
            </h2>

            <button
                    type="button"
                    onclick="fecharDetalhesAgendamento()">
                ×
            </button>

        </div>


        <div class="modal-body detalhes-agendamento">

            <p>
                <strong>Serviço:</strong>
                <span id="detalheServico"></span>
            </p>

            <p>
                <strong>Técnico:</strong>
                <span id="detalheTecnico"></span>
            </p>

            <p>
                <strong>Elevador:</strong>
                <span id="detalheElevador"></span>
            </p>

            <p>
                <strong>Início:</strong>
                <span id="detalheInicio"></span>
            </p>

            <p>
                <strong>Fim:</strong>
                <span id="detalheFim"></span>
            </p>

            <p>
                <strong>Status:</strong>
                <span id="detalheStatus"></span>
            </p>


            <div class="acoes-agendamento">

                <button
                        class="btn btn-secondary"
                        type="button"
                        onclick="abrirEdicaoAgendamento()">

                    Editar

                </button>


                <button
                        class="btn btn-success"
                        type="button"
                        onclick="concluirAgendamento()">

                    Concluir

                </button>


                <button
                        class="btn btn-danger"
                        type="button"
                        onclick="cancelarAgendamento()">

                    Cancelar

                </button>

            </div>

        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- MODAL EDITAR -->
<!-- ================================================= -->

<div
        id="modalEditarAgendamento"
        class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                Editar Agendamento
            </h2>

            <button
                    type="button"
                    onclick="fecharEdicaoAgendamento()">
                ×
            </button>

        </div>


        <div class="modal-body">

            <label for="editarTecnico">
                Técnico
            </label>

            <select id="editarTecnico">

                <option
                        th:each="tecnico : ${tecnicos}"
                        th:value="${tecnico.id}"
                        th:text="${tecnico.nome}">
                </option>

            </select>


            <label for="editarElevador">
                Elevador
            </label>

            <select id="editarElevador">

                <option
                        th:each="elevador : ${elevadores}"
                        th:value="${elevador.id}"
                        th:text="'Elevador ' + ${elevador.numero}">
                </option>

            </select>


            <label for="editarServico">
                Serviço
            </label>

            <select id="editarServico">

                <option
                        th:each="servico : ${servicos}"
                        th:value="${servico.id}"
                        th:text="${servico.nome}">
                </option>

            </select>


            <label for="editarDataHoraInicio">
                Data e horário
            </label>

            <input
                    id="editarDataHoraInicio"
                    type="datetime-local">


            <button
                    class="btn btn-primary"
                    type="button"
                    onclick="salvarEdicaoAgendamento()">

                Salvar Alterações

            </button>


            <p
                    id="mensagemEdicao"
                    class="mensagem-formulario">
            </p>

        </div>

    </div>

</div>


<!-- STOMP -->

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>

<script th:src="@{/js/agenda.js}"></script>

</body>

</html>
